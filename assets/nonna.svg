<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="t d">
  <title id="t">Nonna</title>
  <desc id="d">Nonna, a grandmother with a grey bun, round glasses on a chain and one raised eyebrow, holding up a wooden spoon.</desc>
  <!-- plate -->
  <circle cx="160" cy="160" r="156" fill="#FFF4E0"/>
  <circle cx="160" cy="160" r="156" fill="none" stroke="#C8412B" stroke-width="8"/>
  <circle cx="160" cy="160" r="143" fill="none" stroke="#C8412B" stroke-width="2" stroke-dasharray="3 7"/>
  <clipPath id="plate"><circle cx="160" cy="160" r="152"/></clipPath>
  <g clip-path="url(#plate)">
    <!-- body: dress and apron -->
    <path d="M58 320 C62 250 100 226 160 226 C220 226 258 250 262 320 Z" fill="#2E4A3A"/>
    <path d="M112 320 L118 244 C135 250 185 250 202 244 L208 320 Z" fill="#FFFBF3"/>
    <path d="M118 244 C135 250 185 250 202 244" fill="none" stroke="#C8412B" stroke-width="4"/>
    <rect x="140" y="272" width="40" height="28" rx="6" fill="#C8412B"/>
    <path d="M146 280 h28 M146 289 h20" stroke="#FFFBF3" stroke-width="3" stroke-linecap="round"/>
    <!-- neck -->
    <rect x="146" y="200" width="28" height="30" rx="10" fill="#E9B58C"/>
    <!-- hair back and bun -->
    <circle cx="160" cy="58" r="30" fill="#A9A6A1"/>
    <circle cx="160" cy="58" r="30" fill="none" stroke="#8C8984" stroke-width="3"/>
    <path d="M140 52 C150 44 170 44 180 52" fill="none" stroke="#8C8984" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="160" cy="132" rx="72" ry="78" fill="#A9A6A1"/>
    <!-- face -->
    <ellipse cx="160" cy="142" rx="58" ry="66" fill="#F2C9A0"/>
    <!-- hair front: parted, swept -->
    <path d="M100 128 C102 88 130 70 160 70 C190 70 218 88 220 128 C204 104 184 94 160 98 C136 94 116 104 100 128 Z" fill="#BDBAB5"/>
    <path d="M160 72 C158 84 158 92 160 98" fill="none" stroke="#8C8984" stroke-width="3" stroke-linecap="round"/>
    <!-- ears and earrings -->
    <ellipse cx="102" cy="146" rx="9" ry="14" fill="#E9B58C"/>
    <ellipse cx="218" cy="146" rx="9" ry="14" fill="#E9B58C"/>
    <circle cx="102" cy="164" r="4" fill="#C8412B"/>
    <circle cx="218" cy="164" r="4" fill="#C8412B"/>
    <!-- eyebrows: the left one is raised -->
    <path d="M122 110 C130 100 142 99 150 104" fill="none" stroke="#6E6A64" stroke-width="5" stroke-linecap="round"/>
    <path d="M170 118 C178 115 190 115 198 119" fill="none" stroke="#6E6A64" stroke-width="5" stroke-linecap="round"/>
    <!-- glasses -->
    <circle cx="136" cy="134" r="19" fill="#FFFFFF" fill-opacity="0.35" stroke="#2B1D14" stroke-width="4"/>
    <circle cx="184" cy="134" r="19" fill="#FFFFFF" fill-opacity="0.35" stroke="#2B1D14" stroke-width="4"/>
    <path d="M155 132 C158 128 162 128 165 132" fill="none" stroke="#2B1D14" stroke-width="4" stroke-linecap="round"/>
    <path d="M117 132 L104 136 M203 132 L216 136" stroke="#2B1D14" stroke-width="3" stroke-linecap="round"/>
    <!-- eyes: one open and looking at you, one narrowed -->
    <circle cx="138" cy="136" r="5" fill="#2B1D14"/>
    <circle cx="139.5" cy="134.5" r="1.6" fill="#FFFFFF"/>
    <circle cx="182" cy="137" r="5" fill="#2B1D14"/>
    <circle cx="183.5" cy="135.5" r="1.6" fill="#FFFFFF"/>
    <path d="M172 129 C178 126 188 126 194 129" fill="none" stroke="#2B1D14" stroke-width="3" stroke-linecap="round"/>
    <!-- glasses chain -->
    <path d="M104 136 C92 170 100 200 124 214" fill="none" stroke="#D9A441" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round"/>
    <path d="M216 136 C228 170 220 200 196 214" fill="none" stroke="#D9A441" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round"/>
    <!-- nose, cheeks, mouth -->
    <path d="M160 142 C156 156 156 164 164 166" fill="none" stroke="#C98E66" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="122" cy="166" r="10" fill="#E88C7A" fill-opacity="0.55"/>
    <circle cx="198" cy="166" r="10" fill="#E88C7A" fill-opacity="0.55"/>
    <path d="M142 184 C152 180 168 180 178 186" fill="none" stroke="#9E3A2A" stroke-width="4" stroke-linecap="round"/>
    <!-- the wooden spoon, raised -->
    <g transform="translate(8 22) rotate(6 262 214)">
      <rect x="256" y="120" width="12" height="150" rx="6" fill="#B07A45"/>
      <ellipse cx="262" cy="104" rx="22" ry="30" fill="#C98F57"/>
      <ellipse cx="262" cy="104" rx="14" ry="20" fill="#B07A45"/>
    </g>
    <!-- hand holding the spoon -->
    <circle cx="272" cy="216" r="17" fill="#F2C9A0"/>
    <path d="M260 208 h20 M260 216 h22 M262 224 h18" stroke="#E0AE85" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M226 262 C238 246 252 232 266 226" fill="none" stroke="#2E4A3A" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
