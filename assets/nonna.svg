<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t d">
  <title id="t">Nonna</title>
  <desc id="d">Nonna: grey bun, big round glasses, one eyebrow up, holding a wooden spoon. Unimpressed.</desc>
  <clipPath id="m"><circle cx="200" cy="200" r="200"/></clipPath>
  <circle cx="200" cy="200" r="200" fill="#E14B2D"/>
  <g clip-path="url(#m)">
    <!-- cardigan and blouse -->
    <path d="M44 420 C52 330 112 298 200 298 C288 298 348 330 356 420 Z" fill="#2F5D46"/>
    <path d="M168 298 L200 356 L232 298 Z" fill="#FFF1DC"/>
    <path d="M168 298 L200 356 L186 300 Z" fill="#264D3A"/>
    <circle cx="150" cy="352" r="6" fill="#FFF1DC"/>
    <circle cx="146" cy="384" r="6" fill="#FFF1DC"/>
    <!-- neck -->
    <rect x="178" y="250" width="44" height="56" rx="14" fill="#E7AB86"/>
    <!-- bun with a basil tie -->
    <circle cx="200" cy="76" r="42" fill="#E2DED8"/>
    <!-- hair behind the face -->
    <ellipse cx="200" cy="186" rx="104" ry="100" fill="#E2DED8"/>
    <!-- ears and earrings -->
    <circle cx="120" cy="206" r="17" fill="#E7AB86"/>
    <circle cx="280" cy="206" r="17" fill="#E7AB86"/>
    <circle cx="120" cy="232" r="8" fill="#E14B2D"/>
    <circle cx="280" cy="232" r="8" fill="#E14B2D"/>
    <!-- face -->
    <ellipse cx="200" cy="202" rx="78" ry="86" fill="#F6C9A4"/>
    <!-- fringe, swept to one side -->
    <path d="M122 196 C114 132 158 108 204 110 C250 110 286 136 278 196 C268 164 246 146 214 142 C176 138 142 156 122 196 Z" fill="#E2DED8"/>
    <path d="M204 110 C236 112 262 124 274 150 C258 138 236 132 214 132 C212 124 208 116 204 110 Z" fill="#B5AFA6"/>
    <!-- eyebrows: the left one is up -->
    <rect x="142" y="158" width="44" height="10" rx="5" fill="#B5AFA6" transform="rotate(-14 164 163)"/>
    <rect x="216" y="170" width="42" height="10" rx="5" fill="#B5AFA6"/>
    <!-- glasses -->
    <circle cx="164" cy="204" r="29" fill="#2A1E17"/>
    <circle cx="164" cy="204" r="21" fill="#FCE3CD"/>
    <circle cx="236" cy="204" r="29" fill="#2A1E17"/>
    <circle cx="236" cy="204" r="21" fill="#FCE3CD"/>
    <rect x="190" y="196" width="20" height="8" rx="4" fill="#2A1E17"/>
    <rect x="124" y="198" width="14" height="7" rx="3.5" fill="#2A1E17"/>
    <rect x="262" y="198" width="14" height="7" rx="3.5" fill="#2A1E17"/>
    <!-- eyes: one looking at you, one unimpressed -->
    <circle cx="166" cy="207" r="8" fill="#2A1E17"/>
    <circle cx="169" cy="204" r="2.6" fill="#FFFFFF"/>
    <circle cx="234" cy="209" r="8" fill="#2A1E17"/>
    <rect x="224" y="199" width="22" height="9" fill="#FCE3CD"/>
    <!-- nose, cheeks, mouth -->
    <path d="M200 214 C188 232 190 244 204 244 C212 244 214 236 206 232 Z" fill="#E7AB86"/>
    <circle cx="146" cy="250" r="14" fill="#F09A82"/>
    <circle cx="254" cy="250" r="14" fill="#F09A82"/>
    <rect x="182" y="262" width="36" height="9" rx="4.5" fill="#9A3323"/>
    <!-- the wooden spoon -->
    <g transform="rotate(16 304 330)">
      <rect x="296" y="150" width="16" height="230" rx="8" fill="#D08F4E"/>
      <ellipse cx="304" cy="132" rx="32" ry="42" fill="#D08F4E"/>
      <ellipse cx="304" cy="128" rx="20" ry="28" fill="#A96C34"/>
    </g>
    <!-- sleeve and hand -->
    <path d="M250 420 C258 380 276 350 300 338 L322 372 C304 384 292 400 288 420 Z" fill="#2F5D46"/>
    <circle cx="306" cy="332" r="24" fill="#F6C9A4"/>
    <rect x="290" y="318" width="30" height="7" rx="3.5" fill="#E7AB86"/>
    <rect x="290" y="330" width="32" height="7" rx="3.5" fill="#E7AB86"/>
  </g>
