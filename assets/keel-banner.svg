<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-label="Keel — a production-grade, token-efficient harness for Claude Code" font-family="'Inter', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2336"/>
      <stop offset="0.55" stop-color="#0b2840"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.27" cy="0.40" r="0.62">
      <stop offset="0" stop-color="#1c4f74" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0a2336" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8fb4"/>
      <stop offset="0.55" stop-color="#cf7a5e"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="bulb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaa285"/>
      <stop offset="1" stop-color="#d4714f"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbdcec"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9db8cc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9db8cc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9db8cc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="focal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect x="8" y="8" width="1264" height="384" rx="18"/></clipPath>
  </defs>

  <!-- card -->
  <rect x="8" y="8" width="1264" height="384" rx="18" fill="url(#sky)"/>
  <g clip-path="url(#card)">
    <rect x="8" y="8" width="1264" height="384" fill="url(#glow)"/>

    <!-- bathymetric depth contours (nautical-chart motif) -->
    <g fill="none" stroke="#2f6189" stroke-linecap="round">
      <path d="M -20 96 C 220 80 430 112 660 96 S 1080 78 1300 100" stroke-opacity="0.12" stroke-width="1.3"/>
      <path d="M -20 250 C 240 232 430 270 700 250 S 1080 232 1300 254" stroke-opacity="0.16" stroke-width="1.3"/>
      <path d="M -20 286 C 250 266 470 306 720 286 S 1090 268 1300 290" stroke-opacity="0.18" stroke-width="1.3"/>
      <path d="M -20 322 C 250 302 470 342 720 322 S 1090 304 1300 326" stroke-opacity="0.20" stroke-width="1.3" stroke-dasharray="2 7"/>
      <path d="M -20 356 C 250 338 470 376 720 356 S 1090 340 1300 360" stroke-opacity="0.14" stroke-width="1.3"/>
    </g>
    <g fill="#6f93b0" fill-opacity="0.32" font-size="11" font-style="italic" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
      <text x="958" y="246">18</text>
      <text x="1062" y="283">32</text>
      <text x="884" y="352">47</text>
    </g>

    <!-- double hairline chart frame -->
    <rect x="20" y="20" width="1240" height="360" rx="12" fill="none" stroke="#3a6a8c" stroke-opacity="0.24" stroke-width="1.2"/>
    <rect x="26" y="26" width="1228" height="348" rx="9" fill="none" stroke="#3a6a8c" stroke-opacity="0.10" stroke-width="1"/>
  </g>

  <!-- keel mark: hull · waterline · finned bulb keel -->
  <g transform="translate(120 92)">
    <ellipse cx="0" cy="150" rx="58" ry="40" fill="url(#focal)"/>
    <!-- hull underbody -->
    <path d="M -56 42 C -40 14 40 14 56 42 Z" fill="#ffffff" fill-opacity="0.05"/>
    <path d="M -56 42 C -40 14 40 14 56 42" fill="none" stroke="#7fa6c2" stroke-opacity="0.6" stroke-width="2"/>
    <!-- waterline with wavelets -->
    <path d="M -78 44 q 13 -7 26 0 t 26 0 t 26 0 t 26 0 t 26 0" fill="none" stroke="#5c829e" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M -78 50 q 13 -6 26 0 t 26 0 t 26 0 t 26 0 t 26 0" fill="none" stroke="#d97757" stroke-opacity="0.30" stroke-width="1.6"/>
    <!-- fin -->
    <path d="M -25 44 L 21 44 L 9 150 L -9 150 Z" fill="url(#foil)"/>
    <path d="M -25 44 L 21 44" stroke="#cfe2f0" stroke-opacity="0.45" stroke-width="1.4"/>
    <path d="M 19 48 L 8 148" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.4"/>
    <!-- bulb -->
    <ellipse cx="0" cy="156" rx="33" ry="10.5" fill="url(#bulb)"/>
    <ellipse cx="-9" cy="152" rx="11" ry="3.4" fill="#ffffff" fill-opacity="0.40"/>
  </g>

  <!-- wordmark -->
  <text x="277" y="210" font-size="112" font-weight="800" letter-spacing="3" fill="#04121e" fill-opacity="0.45">KEEL</text>
  <text x="275" y="207" font-size="112" font-weight="800" letter-spacing="3" fill="url(#ink)">KEEL</text>
  <rect x="279" y="229" width="312" height="6" rx="3" fill="url(#rule)"/>

  <!-- taglines -->
  <text x="282" y="265" font-size="25" font-weight="600" fill="#d2e2ef">The backbone that keeps you upright.</text>
  <text x="282" y="298" font-size="18" fill="#8fadc6">A production-grade, token-efficient harness for Claude Code.</text>

  <!-- badge chips -->
  <g font-size="15.5" font-weight="600">
    <g>
      <rect x="874" y="40" width="92" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#3a6a8c" stroke-opacity="0.45" stroke-width="1.2"/>
      <text x="920" y="62.5" text-anchor="middle" fill="#9db8cc">v0.1.0</text>
    </g>
    <g>
      <rect x="978" y="40" width="66" height="34" rx="17" fill="#ffffff" fill-opacity="0.05" stroke="#3a6a8c" stroke-opacity="0.45" stroke-width="1.2"/>
      <text x="1011" y="62.5" text-anchor="middle" fill="#9db8cc">MIT</text>
    </g>
    <g>
      <rect x="1056" y="40" width="184" height="34" rx="17" fill="#d97757" fill-opacity="0.14" stroke="#d97757" stroke-opacity="0.65" stroke-width="1.2"/>
      <circle cx="1075" cy="57" r="3.4" fill="#e8927c"/>
      <text x="1152" y="62.5" text-anchor="middle" fill="#e8a78f">Built for Claude Code</text>
    </g>
  </g>

  <!-- footer -->
  <rect x="282" y="344" width="958" height="1" fill="url(#foot)"/>
  <text x="282" y="372" font-size="15.5" font-weight="600" letter-spacing="3" fill="#7c9bb4">RULES&#160;&#160;&#183;&#160;&#160;AGENTS&#160;&#160;&#183;&#160;&#160;SKILLS&#160;&#160;&#183;&#160;&#160;COMMANDS&#160;&#160;&#183;&#160;&#160;HOOKS</text>
  <text x="1240" y="372" text-anchor="end" font-size="14.5" font-style="italic" fill="#5f7e98">the LLM proposes; gates decide</text>
</svg>
