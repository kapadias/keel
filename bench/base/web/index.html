<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>benchapp</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h1>Sign up</h1>
  <form id="signup">

  <script src="app.js"></script>
</body>
</html>
