# Keel CI — the harness held to its own bar. Three deterministic gates:
# shellcheck (every script), harness-lint (the harness validates itself), and
# the gate golden tests (proof each gate blocks vs. allows).
# Adopters: add your own lint/type/test gate as another job — see stacks/.
name: Keel CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on all scripts (follow sourced libs)
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -x

  harness-lint:
    name: harness-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the harness against its own rules
        run: python3 tests/harness_lint.py

  gates:
    name: gate self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the gate golden tests
        run: bash tests/run.sh
