name: Nonna let something through
description: A red suite, a push to main, a secret or a force push got past her.
labels: ["missed"]
body:
  - type: textarea
    id: what
    attributes:
      label: What got through
      placeholder: The agent said done with tests/test_split.py failing.
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: The command or file involved
      placeholder: '"git push --force origin main" or "config/settings.py"'
      render: text
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of /nonna
      render: text
  - type: dropdown
    id: host
    attributes:
      label: Agent and install
      options: ["Claude Code, plugin", "Claude Code, install.sh", "Codex", "Cursor", "GitHub Copilot", "Gemini CLI", "Windsurf", "Cline", "Kiro", "Other"]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and shell
      placeholder: macOS 15, zsh
